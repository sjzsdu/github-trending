[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghtrend"
version = "0.1.0"
description = "GitHub Trending 采集、多角度解读生成与多平台发布工具（v1: dry-run pipeline）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 真实发布（掘金等）：playwright install chromium
publish = ["playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["ghtrend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
