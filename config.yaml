# GitHub Trending 解读流水线配置
# 命令行/环境变量可覆盖大部分字段，见 README.md

languages:
  - python
  - go
  - rust
  - typescript

periods:
  - daily
  # - weekly
  # - monthly

paths:
  snapshots: data/snapshots
  archive_db: archive.db
  artifacts: artifacts
  payloads: artifacts/payloads

limits:
  # 每日最大生成文章数（LLM token / 平台风控预算）
  daily_articles: 3
  # 每次 pipeline 最多选取的 repo 数（CLI --limit 覆盖此值）
  select_limit: 2
  # 抓取请求间隔秒数（礼貌限速）
  fetch_interval_seconds: 3
  # 送入 LLM 前对 README 的最大字符数截断
  max_readme_chars: 12000

angles:
  - id: intro
    name: 上手实测
    # 选题路由：新星项目（stars 低、新面孔）
    prompt: |
      面向第一次接触该项目的开发者写一篇上手实测：项目是什么、解决什么真实痛点、
      装上并跑通最小示例的完整过程（命令与代码块从 README 原样摘取，配白话解释每步在干什么）、
      适合谁/不适合谁。口吻是刚亲手试完这个项目的工程师向同事复盘：
      多用具体细节和第一人称视角（“我装的时候”“第一个意外是……”），
      少用罗列式小标题，段落之间要有信息递进而非并列拼盘。900-1500 字。
  - id: architecture
    name: 架构精讲
    # 选题路由：成长期项目（1000+ stars）
    prompt: |
      面向有经验的工程师精讲该项目架构：核心模块怎么分工、一条请求/数据如何流动、
      关键依赖与选型为什么成立，并给出一块 mermaid（graph TD）图展示模块关系。
      只基于提供的 README 与目录树推断，推断处标注“（据目录结构推断）”。
      重点写“为什么这样设计”，不要复述功能列表；每个论断给出来自材料的证据。
      900-1500 字。
  - id: success_story
    name: 成功故事
    # 选题路由：高星成熟项目（10000+ stars）
    prompt: |
      讲清该项目是如何获得社区关注的：只引用输入元数据中可核验的事实
      （star/fork 数、创建时间、issue 数、README 里的真实里程碑），叙事克制；
      拆解它做对了哪几件关键事、哪些是可迁移的经验，哪些靠的是时机。
      禁止无依据归因、禁止夸张形容（“惊艳”“颠覆”一律不用）。900-1500 字。
  - id: use_case
    name: 用途推演
    # 选题路由：AI / 工具类项目（description 含 LLM/agent/模型等关键词）
    prompt: |
      设想该项目在真实业务中的 3 个落地场景：每个场景先写清“谁的什么痛点”，
      再写“用该项目怎么解”，附上对应的配置或代码片段（从 README 原样摘取），
      并明确标注哪些属于合理推演、哪些是项目文档原文。
      结尾给出“第一个值得试的场景”这种可执行建议，不做“未来已来”式展望。900-1500 字。

llm:
  # OpenAI 兼容端点（真实调用为默认路径，--mock-llm 仅用于离线测试）。
  # key 只走环境变量，不入库：
  #   GHTREND_LLM_API_KEY > DEEPSEEK_API_KEY > DASHSCOPE_API_KEY > OPENAI_API_KEY
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  temperature: 0.7
  max_tokens: 4096

enrich:
  # GitHub REST；token 从环境变量 GHTREND_GITHUB_TOKEN 读取，缺省走未认证限额
  api_base: https://api.github.com
  timeout_seconds: 15

scrape:
  base_url: https://github.com/trending
  user_agent: ghtrend-bot/0.1 (+https://github.com/sjzsdu/github-trending)
  timeout_seconds: 20

publish:
  # run 命令自动发布的平台与顺序（所有平台都已接入真实 DOM 自动化）
  platforms: [juejin, toutiao, csdn, zhihu]
  # draft = 只进草稿箱（默认，人工确认后再发）；publish = 真实发布。CLI --mode 可覆盖单次
  mode: draft
  # 平台间发布间隔秒数；风控要求 ≥300（F4），配置更小会被强制抬到 300
  interval_seconds: 300
  # 登录态浏览器 profile 根目录（含 cookie/登录态，已 gitignore，禁止入库）
  profiles_dir: profiles
  # ---- 每平台配置 ----
  juejin:
    editor_url: https://juejin.cn/editor/drafts/new
    # 无头模式（默认 false）：true 时发布不弹出浏览器窗口，适合无 GUI 的 cron 服务器。
    # 代价：headless 更易被字节风控识别，稳妥用法：先 headed 登录一次，再开 true。
    headless: false
    category: 前端
    max_tags: 3
    ai_declaration: true
  toutiao:
    editor_url: https://mp.toutiao.com/profile_v4/graphic/publish
    headless: false
    category: ""
    max_tags: 3
    ai_declaration: true
  csdn:
    editor_url: https://mp.csdn.net/mp_blog/creation/editor
    headless: false
    category: ""
    max_tags: 3
    ai_declaration: true
  zhihu:
    editor_url: https://zhuanlan.zhihu.com/write
    headless: false
    category: ""
    max_tags: 3
    ai_declaration: true
